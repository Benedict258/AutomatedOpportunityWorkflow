version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opportunity_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opp_user} -d ${POSTGRES_DB:-opportunity_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
